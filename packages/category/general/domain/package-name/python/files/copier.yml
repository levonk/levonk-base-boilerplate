_min_copier_version: "9.0.0"
_subdirectory: files
_templates_suffix: .jinja
package_name:
  type: str
  help: Name of the package (kebab-case)
# REPO_ROOT is used by .envrc.jinja and the shared _shared/envrc.jinja
# partial as the project root path. At copy time the project root is the
# destination directory itself, so "." is the correct portable value.
REPO_ROOT:
  type: str
  help: "Project root path used inside .envrc (relative to the .envrc file)"
  default: "."
package_description:
  type: str
  help: Short description of the package
category:
  type: str
  help: "Package category (features|services|core|ui)"
domain:
  type: str
  help: "Business domain or technical capability (e.g. auth, commerce)"
author_name:
  type: str
  help: Author name
  default: "levonk"
author_email:
  type: str
  help: Author email
  default: "levonk@example.com"
license:
  type: str
  help: License for the package
  default: "MIT"
python_version:
  type: str
  help: Python version
  default: "3.11"
include_tests:
  type: bool
  help: Include test framework setup?
  default: true
include_ci:
  type: bool
  help: Include CI/CD configuration?
  default: true
