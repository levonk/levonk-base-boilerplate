_subdirectory: files
_templates_suffix: ".jinja"

package_name:
  type: str
  help: Name of the package (kebab-case)
# REPO_ROOT is used by .envrc.jinja and the shared _shared/.envrc.jinja
# partial as the project root path. At copy time the project root is the
# destination directory itself, so "." is the correct portable value.
REPO_ROOT:
  type: str
  help: "Project root path used inside .envrc (relative to the .envrc file)"
  default: "."
package_description:
  type: str
  help: Short description of the package
category:
  type: str
  help: "Package category (features|services|core|ui)"
domain:
  type: str
  help: "Business domain or technical capability (e.g. auth, commerce)"
