package_name:
  type: str
  help: What is the project name?
  default: "my-cli-tool"

package_slug:
  type: str
  help: What is the project slug? (e.g. my_tool)
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

# REPO_ROOT is used by .envrc.jinja and the shared _shared/dot_envrc.jinja
# partial as the project root path. At copy time the project root is the
# destination directory itself, so "." is the correct portable value.
REPO_ROOT:
  type: str
  help: "Project root path used inside .envrc (relative to the .envrc file)"
  default: "."

description:
  type: str
  help: Short description of the project
  default: "A CLI tool"

version:
  type: str
  help: Initial version of the project
  default: "0.1.0"

_subdirectory: files
_templates_suffix: ".jinja"
