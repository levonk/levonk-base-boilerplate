_min_copier_version: "9.0.0"
_subdirectory: files
_templates_suffix: ".jinja"

# Questions
# NOTE: Do not use a top-level `_defaults:` block — Copier ignores it
# (only `_`-prefixed keys Copier recognizes are honored:
# `_templates_suffix`, `_subdirectory`, `_tasks`, `_exclude`, etc.).
# Put defaults on each question via the `default:` key instead.
package_name:
  type: str
  help: "Package name (kebab-case, used in package.json)."
  default: "browser-extension-sample"
  validator: "{% if not package_name %}Package name is required{% endif %}"

display_name:
  type: str
  help: "Human-friendly extension name (shown in browser extension UI)."
  default: "Browser Extension Sample"

project_name:
  type: str
  help: "Display name used in rendered files (.envrc, README, devbox.json)"
  default: "{{ display_name }}"

# REPO_ROOT is used by .envrc.jinja and the shared _shared/envrc.jinja
# partial as the project root path. At copy time the project root is the
# destination directory itself, so "." is the correct portable value.
REPO_ROOT:
  type: str
  help: "Project root path used inside .envrc (relative to the .envrc file)"
  default: "."

description:
  type: str
  help: "Short description for manifest and README."
  default: "A universal browser extension scaffold."

author_name:
  type: str
  help: "Author name."
  default: "Your Name"

author_email:
  type: str
  help: "Author email."
  default: "your.email@example.com"

repository_url:
  type: str
  help: "Repository URL for this extension."
  default: "https://github.com/your-org/your-repo"

extension_version:
  type: str
  help: "Initial extension version (semver)."
  default: "0.1.0"

target_browsers:
  type: str
  help: "Target browsers (comma-separated: chrome,firefox,edge)."
  default: "chrome,firefox,edge"

include_options_page:
  type: bool
  help: "Include an options page for configuration?"
  default: true

include_popup:
  type: bool
  help: "Include a toolbar button with popup UI?"
  default: true

include_content_script:
  type: bool
  help: "Include a starter content script hook?"
  default: false

_ignore:
  - "node_modules"
  - "dist"
  - "out"
  - ".git"
  - ".turbo"

# Post-copy validation: fail if any rendered file still contains
# unrendered Jinja artifacts ({{ ... }} or {% ... %}). This catches
# missing question definitions and broken template variables before
# the generated project ships.
_tasks:
  - |
    bash -c '{% raw %}
    set -euo pipefail
    offenders="$(grep -rIn --include="*" \
      -e "{{[[:space:]]*[^}]*}}" \
      -e "{%[[:space:]]*[^%]*%}" \
      . 2>/dev/null | grep -v -E "/(\.git|node_modules|\.next|dist|out|__pycache__|\.turbo)/" || true)"
    if [ -n "$offenders" ]; then
      echo "ERROR: Unrendered Jinja artifacts found in generated project:" >&2
      echo "$offenders" >&2
      echo "" >&2
      echo "This means a copier.yml question is missing or a template variable is undefined." >&2
      echo "Fix the source template copier.yml and re-run copier." >&2
      exit 1
    fi
    echo "OK: No unrendered Jinja artifacts in generated project."
    {% endraw %}'
