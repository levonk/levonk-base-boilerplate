# Template variables
_subdirectory: "files"

package_name:
  type: str
  help: "The human-readable name of the extension"
  default: "VSCode Recents"

extension_id:
  type: str
  help: "The kebab-case ID"
  default: "vscode-recents"
  validator: "^[a-z0-9-]+$"

publisher:
  type: str
  help: "Your publisher name (for marketplace)"

# REPO_ROOT is used by .envrc.jinja and the shared _shared/.envrc.jinja
# partial as the project root path. At copy time the project root is the
# destination directory itself, so "." is the correct portable value.
REPO_ROOT:
  type: str
  help: "Project root path used inside .envrc (relative to the .envrc file)"
  default: "."

description:
  type: str
  default: "Advanced recent files tracker"
  help: "Description"

author_name:
  type: str
  help: "Author Name"

author_email:
  type: str
  help: "Author Email"

repository_url:
  type: str
  help: "Repository URL"

_templates_suffix: ".jinja"

# File exclusions
_exclude:
  - "node_modules"
  - "out"
  - "dist"
  - ".vscode-test"
  - "*.log"
