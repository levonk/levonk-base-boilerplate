# Copier template for AI Ollama samples (Airflow DAG + docs)
# Render with: copier copy ./boilerplate/apps/infrastructure/ai-ollama-samples <destination>

_min_copier_version: "9.0.0"

# Questions for template
package_name:
  type: str
  help: "Project/directory name for the generated samples"
  default: "ai-ollama-samples"

# REPO_ROOT is used by .envrc.jinja and the shared _shared/dot_envrc.jinja
# partial as the project root path. At copy time the project root is the
# destination directory itself, so "." is the correct portable value.
REPO_ROOT:
  type: str
  help: "Project root path used inside .envrc (relative to the .envrc file)"
  default: "."

ollama_base_url:
  type: str
  help: "Base URL for Ollama service"
  default: "http://ollama:11434"

license:
  type: str
  help: "License header line (optional)"
  default: ""

# Files to render
_subdirectory: files

_templates_suffix: .jinja
